services:
  - type: web
    name: interview-scheduler-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: interview-scheduler-db
          property: connectionString

databases:
  - name: interview-scheduler-db
    plan: free
